name: Bug or content error
description: Something on the site is broken, or a challenge or test is wrong
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL or file path
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: For a wrong test, include the input, the expected output in tests.json, and what you believe is correct.
    validations:
      required: true
